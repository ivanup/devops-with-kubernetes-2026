apiVersion: apps/v1
kind: Deployment
metadata:
  name: pingpong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pingpong
  template:
    metadata:
      labels:
        app: pingpong
    spec:
      volumes:
      - name: shared-logs
        persistentVolumeClaim:
          claimName: shared-pvc
      containers:
        - name: pingpong
          image: arianesec/pingpong:1.11
          env:
            - name: PORT
              value: "3001"
          volumeMounts:
            - name: shared-logs
              mountPath: /usr/src/app/files

---
apiVersion: v1
kind: Service
metadata:
  name: pingpong-svc
spec:
  type: ClusterIP
  selector:
    app: pingpong
  ports:
    - port: 2345
      protocol: TCP
      targetPort: 3001