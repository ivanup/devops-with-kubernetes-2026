apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      containers:         
        - name: log-output
          image: arianesec/log-output:2.1
          env:
            - name: PORT
              value: "3000"
            - name: PING_PONG_URL
              value: "http://pingpong-svc:2345/pings"
          ports:
            - containerPort: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: log-output-svc
spec:
  type: ClusterIP
  selector:
    app: log-output
  ports:
    - port: 2345
      protocol: TCP
      targetPort: 3000