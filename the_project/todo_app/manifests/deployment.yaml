apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes:
      - name: project-shared-logs
        persistentVolumeClaim:
          claimName: project-shared-pvc
      containers:
        - name: todo-app
          image: arianesec/todo-app:1.13
          env:
            - name: PORT
              value: "6000"
          volumeMounts:
            - name: project-shared-logs
              mountPath: /usr/src/app/files